// ---------- monthly totals chart (top of the unit list) ----------
// One point per month: the sum of every bill dated in that month, for the chosen kind of cost. Tap a point to read that month.
const CHART_TABS = [['all', '全部'], ['utility', '水电费'], ['rent', '租金'], ['misc', '杂费']];
let chartCat = 'all', chartSel = null;
function chartSeries() {
    const bills = data.bills.filter((b) => b.billDate); if (!bills.length) return [];
    const keys = bills.map((b) => b.billDate.slice(0, 7)).sort();

    while (y < ey || (y === ey && m <= em)) {

}
// axis steps that read well: 0, 20K, 40K, 60K (never 33.3K / 66.7K)
function niceTicks(maxV) {

const shortMoney = (v) => v >= 1000 ? (Math.round(v / 100) / 10).toString().replace(/\.0$/, '') + 'K' : String(Math.round(v));
const whole = (v) => 'RM ' + Math.round(v).toLocaleString('en-US');

    const sx = x(chartSel), sy = y(sel.total), txt = whole(sel.total), bw = txt.length * 6.4 + 18, bx = Math.min(W - 4 - bw, Math.max(4, sx - bw / 2));

    const dots = pts.map((p, i) => `<g onclick="selChart(${i})" style="cursor:pointer"><circle cx="${x(i)}" cy="${y(p.total)}" r="18" fill="transparent"/>${i === chartSel ? `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${T + ph}" stroke="#16a34a" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="3 4"/><circle cx="${x(i)}" cy="${y(p.total)}" r="11" fill="#22c55e" fill-opacity="0.18" class="ch-halo"/>` : ''}<circle cx="${x(i)}" cy="${y(p.total)}" r="${i === chartSel ? 5.4 : 3.8}" fill="${i === chartSel ? '#16a34a' : '#fff'}" stroke="${i === chartSel ? '#fff' : '#16a34a'}" stroke-width="${i === chartSel ? 2.4 : 2.2}"/></g>`).join('');

// resolves to 'save', 'discard' or 'keep' (keep editing; also what tapping outside the box or pressing Esc means)
function askSave(text) {
    return new Promise((resolve) => {
        const box = $('dlg'); $('dlgText').textContent = text; box.classList.remove('hidden');
        const done = (v) => { box.classList.add('hidden'); box.onclick = null; document.removeEventListener('keydown', onKey); resolve(v); };
        const onKey = (e) => { if (e.key === 'Escape') done('keep'); };
        $('dlgSave').onclick = () => done('save'); $('dlgDiscard').onclick = () => done('discard'); $('dlgKeep').onclick = () => done('keep');
        box.onclick = (e) => { if (e.target === box) done('keep'); };

        $('dlgSave').focus();
    });
}

    const u = data.units.find((x) => x.id === editing.unitId); if (!u) return null;
    const value = String(u.wifiNo || '').trim();
    return value && value !== '-' ? { label: 'WiFi 账号', value } : null;
}
// "TM - 7028206386" copies as 7028206386; a field with several numbers is copied as written
function copyValue(v) { const runs = v.match(/\d{6,}/g); return runs && runs.length === 1 ? runs[0] : v; }
async function copyPlain(btn, text) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (err) { /* ignore */ } ta.remove(); }
    toast('已复制 ' + text);
    const icon = btn.querySelector('i'); if (icon) { icon.className = 'fa-solid fa-check'; setTimeout(() => { icon.className = 'fa-regular fa-copy'; }, 1400); }
}
function copyAccount(btn, value) { return copyPlain(btn, copyValue(value)); }

}
function removeMini(i) { const name = editing.items[i].name; removeItem(i); toast(`已删除「${name || '项目'}」· 按 Save 才会保存`); }
function itemRow(it, i, closable) {
    return `<div class="rounded-xl border p-2.5 ${it.status === 'unpaid' ? 'bg-red-50/60 border-red-200' : 'border-slate-200'} ${closable ? 'ring-2 ring-emerald-300' : ''}">

        <div class="flex items-center gap-2"><input class="field !py-1.5 !text-[13px]" placeholder="项目名称" value="${esc(it.name)}" oninput="editing.items[${i}].name=this.value">
            <button onclick="removeItem(${i})" class="text-slate-300 hover:text-red-500 px-1" aria-label="Remove"><i class="fa-solid fa-xmark"></i></button></div>

        <div class="grid grid-cols-[1fr_7.2rem] gap-2 mt-2"><input class="field !py-1.5 !text-[12.5px]" placeholder="费用说明（例如 10/8 – 8/9）" value="${esc(it.detail)}" oninput="editing.items[${i}].detail=this.value">

// one box for link or note: an http(s) address is the receipt link, anything else is a note
function setLinkNote(i, v) { const it = editing.items[i]; if (/^https?:\/\//i.test(v.trim())) { it.link = v.trim(); } else { it.note = v; if (!v) it.link = ''; } }
function updateTotals() { $('bSub').textContent = `${dateLabel(editing.billDate)}费用明细 · ${money(sum(editing.items))}`; }
function addItem(cat) { editing.items.push(blankItem(cat)); if (billCompact) openItem = editing.items.length - 1; renderBill(); }
function removeItem(i) { editing.items.splice(i, 1); openItem = null; renderBill(); }

function cleanBill() {
    return { unitId: editing.unitId, billDate: editing.billDate, received: !!editing.received, notes: editing.notes || '',
        items: editing.items.filter((i) => i.name.trim()).map((i) => ({ ...i, amount: i.amount === '' || i.amount == null ? null : String(i.amount).replace(/,/g, '') })) };
}
async function saveBill(thenCopy) {
    const btn = $('bSave'); btn.disabled = true;
    try {
        const body = cleanBill();
        await trkSaving.run(async () => { editing.id ? await api('PUT', 'rental-bills/' + editing.id, body) : await api('POST', 'rental-bills', body); await reload(); });
        toast('Saved');
        if (thenCopy) { const uid = editing.unitId; closeBill(); newBill(uid); } else { closeBill(); }
    } catch (e) { toast(e.message); } finally { btn.disabled = false; }
}
async function deleteBill() {
    if (!confirm('Delete this bill? This cannot be undone.')) return;
    try { await api('DELETE', 'rental-bills/' + editing.id); await reload(); closeBill(); toast('Bill deleted'); } catch (e) { toast(e.message); }

// ---------- the picture for the tenant ----------
// The statement follows the layout of the Google Sheet: a title row, then 项目 / 细项目 / 费用 / 金额 / 状态,
// the category cell merged down its rows, a subtotal row per category and one grand-total row at the bottom.
const STMT_WIDTH = 660;
const STMT_LEFT = { utility: '水电费', rent: '租金', misc: '各类杂费', stamp: '租约盖章费' };
const STMT_SUB = { utility: '水电费总计', rent: '房租费总计', misc: '各类杂费总计', stamp: '租约盖章费总计' };
const STMT_PILL = { paid: ['#dcfce7', '#15803d'], pending: ['#fef3c7', '#92400e'], unpaid: ['#fee2e2', '#b91c1c'] };
// the same item name more than once (3 water bills, 2 electricity bills...): shown once, in one merged cell.
// Same names are put next to each other (first appearance decides the order) so they can merge.
const stmtTogether = (rows) => { const names = []; rows.forEach((r) => { if (!names.includes(r.name)) names.push(r.name); }); return names.flatMap((n) => rows.filter((r) => r.name === n)); };
// A long amount (RM 30,000.00, RM 125,000.00) in the narrow 金额 column gets a smaller font so it fits, still centred.
const stmtMeasure = document.createElement('canvas').getContext('2d');
function fitSize(text, weight, maxW, base, min) {
    let size = base;
    while (size > (min || 9)) { stmtMeasure.font = `${weight} ${size}px "Inter","PingFang SC","Noto Sans SC",system-ui,sans-serif`; if (stmtMeasure.measureText(text).width <= maxW) break; size -= 0.5; }
    return size;
}
const STMT_AMOUNT_W = (STMT_WIDTH - 40) * 17 / 100;   // width of the 金额 column
// the text of the "费用" cell
function stmtFee(i) {
    const amt = i.amount == null ? '' : money(i.amount);
    if (i.detail && amt) return `* ${i.detail}: ${amt}`;
    return i.detail || amt || '—';
}
function statementHtml(b) {
    const u = data.units.find((x) => x.id === b.unitId);
    const LEFT = STMT_LEFT, SUB = STMT_SUB, PILL = STMT_PILL;
    const bd = '1px solid #cbd5e1'; const td = (extra = '') => `border:${bd};padding:9px 8px;${extra}`;
    const fee = (i) => {
        const amt = i.amount == null ? '' : money(i.amount);
        if (i.detail && amt) return `* ${esc(i.detail)}: ${amt}`;
        return esc(i.detail) || amt || '—';
    };
    const groups = CATS.map(([key]) => ({ key, rows: b.items.filter((i) => i.category === key) })).filter((g) => g.rows.length);
    const together = stmtTogether;
    const body = groups.map((g) => {
        const sub = sum(g.rows);
        const list = together(g.rows);
        const rows = list.map((i, k) => `<tr>
            ${k === 0 ? `<td rowspan="${list.length}" style="${td('background:#f0fdf4;font-weight:800;color:#14532d;text-align:center;vertical-align:middle;white-space:nowrap')}">【${LEFT[g.key]}】</td>` : ''}
            ${k > 0 && list[k - 1].name === i.name ? '' : `<td rowspan="${list.filter((r) => r.name === i.name).length}" style="${td('font-weight:700;text-align:center;vertical-align:middle')}">${esc(i.name)}</td>`}
            <td style="${td('text-align:center;line-height:1.45')}">${fee(i)}</td>
            ${k === 0 ? `<td rowspan="${list.length}" style="${td('')}"></td>` : ''}
            <td style="${td('text-align:center')}"><span style="display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;background:${PILL[i.status][0]};color:${PILL[i.status][1]}">${STATUS[i.status]}</span></td></tr>`).join('');
        return rows + `<tr><td colspan="3" style="${td('text-align:center;font-weight:800;background:#f8fafc')}">【${SUB[g.key]}】</td><td style="${td('text-align:center;font-weight:800;background:#f8fafc;white-space:nowrap;font-size:' + fitSize(money(sub), 800, STMT_AMOUNT_W - 16, 14) + 'px')}">${money(sub)}</td><td style="${td('background:#f8fafc')}"></td></tr>`;
    }).join('');
    const label = groups.length > 1 ? groups.map((g) => LEFT[g.key]).join(' + ') + '总计' : (groups[0] ? SUB[groups[0].key] : '总计');
    return `<div style="width:${STMT_WIDTH}px;background:#fff;padding:22px 20px 20px;box-sizing:border-box;font-family:Inter,'PingFang SC','Noto Sans SC',sans-serif;color:#0f172a;font-size:14px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><img src="/tracker-icon/apple-touch-icon.png" style="width:34px;height:34px;border-radius:9px" crossorigin="anonymous"><div style="font-size:12px;color:#64748b;font-weight:600">m.boutiquehomes</div></div>
        <div style="border-radius:14px;overflow:hidden;border:${bd}">
        <table style="width:100%;border-collapse:collapse;table-layout:fixed;margin:-1px">
            <colgroup><col style="width:17%"><col style="width:18%"><col style="width:32%"><col style="width:17%"><col style="width:16%"></colgroup>
            <tr><td colspan="5" style="${td('text-align:center;background:linear-gradient(135deg,#16a34a,#166534);color:#fff;padding:14px 10px')}"><div style="font-size:18px;font-weight:800">${esc(u.name)} ${dateLabel(b.billDate)}费用明细</div></td></tr>
            <tr style="background:#ecfdf5">${['项目', '细项目', '费用', '金额', '状态'].map((h) => `<td style="${td('text-align:center;font-weight:800;color:#14532d')}">${h}</td>`).join('')}</tr>
            ${body}
            <tr><td colspan="3" style="${td('text-align:center;font-weight:800;background:#f0fdf4;padding:13px 10px')}">【${label}】</td><td style="${td('text-align:center;font-weight:800;color:#dc2626;background:#f0fdf4;white-space:nowrap;font-size:' + fitSize(money(sum(b.items)), 800, STMT_AMOUNT_W - 16, 15) + 'px')}">${money(sum(b.items))}</td><td style="${td('text-align:center;background:#f0fdf4')}">${b.received ? '<span style="display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:800;background:#166534;color:#fff">Received</span>' : ''}</td></tr>
        </table></div>
        ${b.notes ? `<div style="margin-top:12px;font-size:12px;color:#475569;white-space:pre-wrap">${esc(b.notes)}</div>` : ''}
        <div style="margin-top:12px;text-align:center;font-size:11px;color:#94a3b8">Thank you · 谢谢</div></div>`;
}

// on screen, full width: the tenant can be sent a screenshot of it
let stmtBill = null;
function showStatement(id) {
    stmtBill = data.bills.find((b) => b.id === id); if (!stmtBill) return;
    $('stmtBody').innerHTML = `<div id="stmtScale" style="transform-origin:top left;width:${STMT_WIDTH}px">${statementHtml(stmtBill)}</div>`;
    $('stmtSheet').classList.remove('hidden'); $('stmtSheet').scrollTop = 0; document.body.style.overflow = 'hidden';
    fitStatement();
}
function fitStatement() {
    const box = $('stmtBody'), inner = $('stmtScale'); if (!inner) return;
    const k = Math.min(1, box.clientWidth / STMT_WIDTH);
    inner.style.transform = `scale(${k})`; box.style.height = `${inner.offsetHeight * k}px`;
}
window.addEventListener('resize', fitStatement);
function closeStatement() { $('stmtSheet').classList.add('hidden'); stmtBill = null; if ($('billSheet').classList.contains('hidden') && $('unitSheet').classList.contains('hidden')) document.body.style.overflow = ''; }

// The statement as a picture. It is drawn straight onto a canvas, with every cell and every line of text placed by us
// (text centred with textBaseline "middle"), so it looks the same in every browser. (Turning the HTML into a picture
// with a library put the text at the bottom of its cell on iPhone.)
const STMT_FONT = '"Inter","PingFang SC","Noto Sans SC",system-ui,sans-serif';
function loadImage(src) { return new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }

async function statementCanvas(b) {
    const u = data.units.find((x) => x.id === b.unitId);
    try { await Promise.all([document.fonts.load(`500 14px ${STMT_FONT}`), document.fonts.load(`700 14px ${STMT_FONT}`), document.fonts.load(`800 14px ${STMT_FONT}`)]); } catch (e) { /* use whatever is there */ }
    const logo = await loadImage('/tracker-icon/apple-touch-icon.png');

    const S = 2, W = STMT_WIDTH, PAD = 20, TW = W - PAD * 2, BORDER = '#cbd5e1';
    const f = (w, size) => `${w} ${size}px ${STMT_FONT}`;
    const pct = [17, 18, 32, 17, 16]; const colX = [0]; pct.forEach((p, i) => colX.push(colX[i] + TW * p / 100));
    const colW = (i) => colX[i + 1] - colX[i];
    const m = document.createElement('canvas').getContext('2d');
    // break text into lines that fit (at spaces when possible, otherwise between characters)
    const wrap = (text, maxW, font) => {
        m.font = font; const out = [];
        for (const para of String(text).split('\n')) {
            let line = '';
            for (const ch of Array.from(para)) {
                const t = line + ch;
                if (m.measureText(t).width > maxW && line) {
                    const sp = line.lastIndexOf(' ');
                    if (sp > 0 && ch !== ' ') { out.push(line.slice(0, sp)); line = line.slice(sp + 1) + ch; } else { out.push(line); line = ch === ' ' ? '' : ch; }
                } else line = t;
            }
            out.push(line);
        }
        return out;
    };

    // ---- layout: every row gets a height ----
    const LH = 19;   // line height inside a cell
    const groups = CATS.map(([key]) => ({ key, rows: b.items.filter((i) => i.category === key) })).filter((g) => g.rows.length);
    const TITLE_H = 56, HEAD_H = 38, SUB_H = 40, GRAND_H = 52;
    const layout = groups.map((g) => {
        const list = stmtTogether(g.rows).map((i) => { const lines = wrap(stmtFee(i), colW(2) - 16, f(500, 14)); return { i, lines, h: Math.max(40, lines.length * LH + 20) }; });
        return { g, list, sum: sum(g.rows) };
    });
    let tableH = TITLE_H + HEAD_H; layout.forEach((L) => { tableH += L.list.reduce((a, r) => a + r.h, 0) + SUB_H; }); tableH += GRAND_H;
    const noteLines = b.notes ? wrap(b.notes, TW, f(500, 12)) : [];
    const TOP = 22, LOGO_H = 34, GAP = 12;
    const tableTop = TOP + LOGO_H + GAP;
    const H = tableTop + tableH + (noteLines.length ? 12 + noteLines.length * 17 : 0) + 14 + 14 + 20;

    const cv = document.createElement('canvas'); cv.width = W * S; cv.height = Math.round(H * S);
    const c = cv.getContext('2d'); c.scale(S, S);
    c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);

    const rr = (x, y, w, h, r) => { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
    const text = (str, cx, cy, font, color, align = 'center') => { c.font = font; c.fillStyle = color; c.textAlign = align; c.textBaseline = 'middle'; c.fillText(str, cx, cy); };
    const lines = (arr, cx, cy, font, color) => { const top = cy - (arr.length - 1) * LH / 2; arr.forEach((l, k) => text(l, cx, top + k * LH, font, color)); };
    const cell = (x, y, w, h, fill) => { if (fill) { c.fillStyle = fill; c.fillRect(x, y, w, h); } c.strokeStyle = BORDER; c.lineWidth = 1; c.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1); };
    const pill = (label, cx, cy, bg, fg, padX) => {
        c.font = f(800, 12); const w = c.measureText(label).width + padX * 2, h = 22;
        rr(cx - w / 2, cy - h / 2, w, h, h / 2); c.fillStyle = bg; c.fill(); text(label, cx, cy + 0.5, f(800, 12), fg);
    };

    // ---- the little header: logo + name ----
    if (logo) { c.save(); rr(PAD, TOP, LOGO_H, LOGO_H, 9); c.clip(); c.drawImage(logo, PAD, TOP, LOGO_H, LOGO_H); c.restore(); }
    text('m.boutiquehomes', PAD + LOGO_H + 10, TOP + LOGO_H / 2, f(700, 12), '#64748b', 'left');

    // ---- the table, clipped to rounded corners ----
    const TX = PAD; let y = tableTop;
    c.save(); rr(TX, tableTop, TW, tableH, 14); c.clip();
    // title bar
    const grad = c.createLinearGradient(TX, y, TX + TW, y + TITLE_H); grad.addColorStop(0, '#16a34a'); grad.addColorStop(1, '#166534');
    cell(TX, y, TW, TITLE_H, null); c.fillStyle = grad; c.fillRect(TX, y, TW, TITLE_H);
    text(`${u.name} ${dateLabel(b.billDate)}费用明细`, TX + TW / 2, y + TITLE_H / 2, f(800, 18), '#fff');
    y += TITLE_H;
    // column titles
    ['项目', '细项目', '费用', '金额', '状态'].forEach((h, k) => { cell(TX + colX[k], y, colW(k), HEAD_H, '#ecfdf5'); text(h, TX + colX[k] + colW(k) / 2, y + HEAD_H / 2, f(800, 14), '#14532d'); });
    y += HEAD_H;

    layout.forEach((L) => {
        const top = y, total = L.list.reduce((a, r) => a + r.h, 0);
        // merged cells: category (left) and the empty amount column
        cell(TX + colX[0], top, colW(0), total, '#f0fdf4'); text(`【${STMT_LEFT[L.g.key]}】`, TX + colX[0] + colW(0) / 2, top + total / 2, f(800, 14), '#14532d');
        cell(TX + colX[3], top, colW(3), total, null);
        // rows
        let ry = top;
        L.list.forEach((r, k) => {
            cell(TX + colX[2], ry, colW(2), r.h, null); lines(r.lines, TX + colX[2] + colW(2) / 2, ry + r.h / 2, f(500, 14), '#0f172a');
            cell(TX + colX[4], ry, colW(4), r.h, null);
            const [bg, fg] = STMT_PILL[r.i.status]; pill(STATUS[r.i.status], TX + colX[4] + colW(4) / 2, ry + r.h / 2, bg, fg, 9);
            // the item name: one merged cell for a run of the same name
            if (k === 0 || L.list[k - 1].i.name !== r.i.name) {
                let run = 0, runH = 0; for (let j = k; j < L.list.length && L.list[j].i.name === r.i.name; j++) { run++; runH += L.list[j].h; }
                cell(TX + colX[1], ry, colW(1), runH, null);
                const nm = wrap(r.i.name, colW(1) - 12, f(700, 14)); lines(nm, TX + colX[1] + colW(1) / 2, ry + runH / 2, f(700, 14), '#0f172a');
            }
            ry += r.h;
        });
        y = ry;
        // subtotal row
        cell(TX, y, colX[3], SUB_H, '#f8fafc'); text(`【${STMT_SUB[L.g.key]}】`, TX + colX[3] / 2, y + SUB_H / 2, f(800, 14), '#0f172a');
        cell(TX + colX[3], y, colW(3), SUB_H, '#f8fafc'); text(money(L.sum), TX + colX[3] + colW(3) / 2, y + SUB_H / 2, f(800, fitSize(money(L.sum), 800, colW(3) - 16, 14)), '#0f172a');
        cell(TX + colX[4], y, colW(4), SUB_H, '#f8fafc');
        y += SUB_H;
    });
    // grand total
    const grandLabel = groups.length > 1 ? groups.map((g) => STMT_LEFT[g.key]).join(' + ') + '总计' : (groups[0] ? STMT_SUB[groups[0].key] : '总计');
    cell(TX, y, colX[3], GRAND_H, '#f0fdf4'); text(`【${grandLabel}】`, TX + colX[3] / 2, y + GRAND_H / 2, f(800, 14), '#0f172a');
    cell(TX + colX[3], y, colW(3), GRAND_H, '#f0fdf4'); text(money(sum(b.items)), TX + colX[3] + colW(3) / 2, y + GRAND_H / 2, f(800, fitSize(money(sum(b.items)), 800, colW(3) - 16, 15)), '#dc2626');
    cell(TX + colX[4], y, colW(4), GRAND_H, '#f0fdf4'); if (b.received) pill('Received', TX + colX[4] + colW(4) / 2, y + GRAND_H / 2, '#166534', '#fff', 12);
    c.restore();
    rr(TX + 0.5, tableTop + 0.5, TW - 1, tableH - 1, 14); c.strokeStyle = BORDER; c.lineWidth = 1; c.stroke();

    // notes + thank-you line
    let ny = tableTop + tableH;
    if (noteLines.length) { ny += 12; noteLines.forEach((l, k) => text(l, PAD, ny + 8 + k * 17, f(500, 12), '#475569', 'left')); ny += noteLines.length * 17; }
    text('Thank you · 谢谢', W / 2, ny + 14 + 5, f(500, 11), '#94a3b8');
    return cv;
}

// the same statement as a picture (share sheet on a phone, download elsewhere)
async function statementImage(bill) {
    const b = bill || cleanBill(); const u = data.units.find((x) => x.id === b.unitId);
    try {
        const canvas = await statementCanvas(b);
        const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
        const name = `${u.name.replace(/[^\w一-龥-]+/g, '_')}-${b.billDate}.png`;
        const file = new File([blob], name, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: u.name }); }
        else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Image saved'); }
    } catch (e) { if (e && e.name !== 'AbortError') toast('Could not make the image'); }
}

// ---------- unit editor ----------
let editUnit = null;
function openUnit(id) {
    editUnit = id ? data.units.find((u) => u.id === id) : null; const u = editUnit || {};
    $('uTitle').textContent = id ? 'Edit unit' : 'New unit';
    const set = (k, v) => { $(k).value = v ?? ''; };
    set('u-name', u.name); set('u-client', u.clientName); set('u-tnb', u.tnbNo); set('u-wifi', u.wifiNo); set('u-water', u.waterNo); set('u-syabas', u.syabasNo);
    set('u-rent', u.rentRm); setMode(u.rentMode); set('u-start', u.rentalStart); set('u-end', u.rentalEnd); set('u-due', u.rentDue); set('u-acc', u.ownerAcc); set('u-notes', u.notes);
    $('uDelete').classList.toggle('hidden', !id);
    renderAgreementEditor(editUnit);
    sheetShow($('unitSheet')); $('unitSheet').scrollTop = 0; document.body.style.overflow = 'hidden';
    unitSnap = unitState();
}
function setMode(v) {
    const sel = $('u-mode'); const m = rentMode(v) || 'Monthly';
    if (!RENT_MODES.includes(m) && ![...sel.options].some((o) => o.value === m)) sel.add(new Option(m, m)); // an unusual old value is kept, not lost
    [...sel.options].forEach((o) => { if (!RENT_MODES.includes(o.value) && o.value !== m) o.remove(); });
    sel.value = m;
}
let unitSnap = '';
const unitState = () => JSON.stringify(['u-name', 'u-client', 'u-tnb', 'u-wifi', 'u-water', 'u-syabas', 'u-rent', 'u-mode', 'u-start', 'u-end', 'u-due', 'u-acc', 'u-notes'].map((k) => $(k).value));
async function requestCloseUnit() {
    if (unitState() === unitSnap) return closeUnit();
    const r = await askSave('这个单位的资料你改过了，还没有保存。要保存吗？');
    if (r === 'save') return saveUnit();
    if (r === 'discard') return closeUnit();
}
function closeUnit() { sheetHide($('unitSheet')); document.body.style.overflow = ''; }
async function saveUnit() {
    const body = { name: $('u-name').value, clientName: $('u-client').value, tnbNo: $('u-tnb').value, wifiNo: $('u-wifi').value, waterNo: $('u-water').value, syabasNo: $('u-syabas').value,
        rentRm: $('u-rent').value, rentMode: $('u-mode').value, rentDue: $('u-due').value, rentalStart: $('u-start').value, rentalEnd: $('u-end').value, ownerAcc: $('u-acc').value, notes: $('u-notes').value };
    try {
        let out;
        await trkSaving.run(async () => { out = editUnit ? await api('PUT', 'rental-units/' + editUnit.id, body) : await api('POST', 'rental-units', body); await reload(); });
        closeUnit(); toast('Saved');
        if (!editUnit) openUnitView(out.unit.id);
    } catch (e) { toast(e.message); }
}
async function deleteUnit() {
    if (!editUnit || !confirm(`Delete “${editUnit.name}” and all of its bills? This cannot be undone.`)) return;
    try { await api('DELETE', 'rental-units/' + editUnit.id); await reload(); closeUnit(); unitId = null; render(); toast('Unit deleted'); } catch (e) { toast(e.message); }
}

async function reload() { data = await api('GET', 'rentals'); render(); }
$('agrInput').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) uploadAgreement(agrTarget, f); });
history.replaceState({ unit: null }, '');
// placeholders in the shape of the unit list while it loads
$('hSub').innerHTML = '<span class="sk inline-block h-2.5 w-28 align-middle"></span>';
$('view').innerHTML = '<div class="sk h-[104px] w-full !rounded-2xl mb-4"></div><div class="space-y-3">' + Array.from({ length: 4 }, () => '<div class="card p-4"><div class="flex justify-between gap-3"><div class="flex-1"><div class="sk h-4 w-36"></div><div class="sk h-3 w-20 mt-2"></div></div><div><div class="sk h-4 w-16 ml-auto"></div><div class="sk h-2.5 w-12 mt-2 ml-auto"></div></div></div><div class="flex gap-1.5 mt-4"><div class="sk h-5 w-20 !rounded-full"></div><div class="sk h-5 w-16 !rounded-full"></div></div></div>').join('') + '</div>';
reload().catch((e) => { $('view').innerHTML = `<div class="text-center text-red-500 text-sm py-16">${esc(e.message)}</div>`; });
</script>
