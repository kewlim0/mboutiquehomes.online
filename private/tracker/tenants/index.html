<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="/tracker-icon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/tracker-icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/tracker-icon/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/tracker-icon/apple-touch-icon.png">
    <title>Tenants</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'PingFang SC', 'Noto Sans SC', 'sans-serif'] } } } };</script>
    <style>
        body { font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', sans-serif; background: #f1f5f9; color: #1e293b; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
        input, select, textarea { font-size: 16px !important; }
        .field { width: 100%; padding: 0.6rem 0.75rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; font-weight: 600; outline: none; }
        .field:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); background: #fff; }
        .lbl { display: block; font-size: 11px; font-weight: 800; color: #64748b; margin: 0 0 0.25rem 0.1rem; }
        .card { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 1.2rem; box-shadow: 0 4px 14px -8px rgba(15, 23, 42, 0.25); }
        .chip { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 10.5px; font-weight: 800; padding: 0.18rem 0.55rem; border-radius: 999px; white-space: nowrap; background: #eef2ff; color: #4338ca; }
        .row { display: flex; align-items: center; gap: 0.65rem; padding: 0.55rem 0; border-top: 1px solid #f1f5f9; }
        .row > i.ic { width: 1.9rem; height: 1.9rem; border-radius: 0.6rem; background: #f1f5f9; color: #64748b; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; flex-shrink: 0; }
        .row .k { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
        .row .v { font-size: 13.5px; font-weight: 700; word-break: break-all; }
        .row .empty { color: #cbd5e1; font-weight: 600; }
        .mini { width: 2rem; height: 2rem; border-radius: 0.65rem; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; flex-shrink: 0; }
        .sheet { position: fixed; inset: 0; z-index: 40; background: #f1f5f9; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .sheet.hidden { display: none; }
        @keyframes slideup { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
        .sheet:not(.hidden) > .inner { animation: slideup 0.25s cubic-bezier(0.22, 1, 0.36, 1); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; font-weight: 800; font-size: 12.5px; padding: 0.7rem 1rem; border-radius: 0.85rem; transition: transform 0.1s; }
        .btn:active { transform: scale(0.97); }
        .btn-ind { background: linear-gradient(135deg, #6366f1, #4338ca); color: #fff; box-shadow: 0 8px 18px -8px rgba(67, 56, 202, 0.7); }
        .btn-red { background: #fef2f2; color: #b91c1c; border: 1.5px solid #fecaca; }
        #toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translate(-50%, 4rem); opacity: 0; z-index: 80; transition: all 0.3s; background: rgba(15, 23, 42, 0.92); color: #fff; font-size: 12px; font-weight: 700; padding: 0.65rem 1.1rem; border-radius: 999px; pointer-events: none; max-width: 90vw; }
        #toast.show { transform: translate(-50%, 0); opacity: 1; }
    </style>
</head>
<body class="min-h-screen">
<div class="w-full max-w-[480px] mx-auto min-h-screen flex flex-col">
    <header class="bg-white/90 backdrop-blur-md px-4 py-3 border-b border-slate-200/80 sticky top-0 z-20 flex flex-col gap-3">
        <div class="flex items-center gap-2.5">
            <a href="/tracker/" aria-label="Back" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center border border-slate-200 text-xs flex-shrink-0"><i class="fa-solid fa-chevron-left"></i></a>
            <div class="min-w-0 flex-1"><div class="font-extrabold text-slate-800 text-sm">Tenants</div><p id="sub" class="text-[11px] text-slate-500 font-medium">&nbsp;</p></div>
            <button onclick="openForm()" class="btn btn-ind !py-2 !px-3 !text-[12px]"><i class="fa-solid fa-plus"></i>Tenant</button>
        </div>
        <div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input id="q" oninput="render()" type="search" placeholder="Search name, unit, passport, phone, email…" class="field !pl-9 !py-2 !text-[13px]" autocomplete="off"></div>
    </header>
    <main id="view" class="px-4 pt-4 pb-24 space-y-3 flex-1"></main>
</div>

<div id="sheet" class="sheet hidden">
    <div class="inner w-full max-w-[480px] mx-auto min-h-screen">
        <div class="bg-white/95 backdrop-blur-md px-4 py-3 border-b border-slate-200 sticky top-0 z-10 flex items-center gap-2.5">
            <button onclick="closeForm()" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center border border-slate-200 text-xs" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
            <div class="min-w-0 flex-1 font-extrabold text-sm" id="fTitle">Tenant</div>
            <button onclick="save()" class="btn btn-ind !py-2 !px-4"><i class="fa-solid fa-check"></i>Save</button>
        </div>
        <form class="px-4 pt-4 pb-24 space-y-3" onsubmit="return false">
            <div><label class="lbl">名称 *</label><input class="field" id="f-name" maxlength="160"></div>
            <div><label class="lbl">证件上的全名</label><input class="field" id="f-full" maxlength="160" placeholder="例如 CHEN, CHANGYOU"></div>
            <div><label class="lbl">单位</label><select class="field" id="f-unit"></select></div>
            <div><label class="lbl">护照号码</label><input class="field" id="f-passport" maxlength="60" autocomplete="off" autocapitalize="characters"></div>
            <div><label class="lbl">电话</label><input class="field" id="f-phone" type="tel" maxlength="40" placeholder="+60 12-345 6789"></div>
            <div><label class="lbl">邮箱</label><input class="field" id="f-email" type="email" maxlength="160" autocapitalize="off"></div>
            <div><label class="lbl">备注</label><textarea class="field" id="f-notes" rows="3" maxlength="4000"></textarea></div>
            <button id="fDelete" type="button" onclick="removeTenant()" class="btn btn-red w-full hidden"><i class="fa-solid fa-trash-can"></i>删除这位租客</button>
        </form>
    </div>
</div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let data = { units: [], tenants: [] }, current = null, shown = new Set(), toastTimer;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400); }
async function api(method, path, body) {
    const res = await fetch('/api/admin/' + path, { method, credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined });
    const out = await res.json().catch(() => ({}));
    if (res.status === 401) { location.replace('/admin/?next=%2Ftracker%2Ftenants%2F'); throw new Error('Please sign in'); }
    if (!res.ok) throw new Error(out.error || 'Something went wrong');
    return out;
}
const unitName = (id) => (data.units.find((u) => u.id === id) || {}).name || '';
const digits = (s) => String(s || '').replace(/\D/g, '');
const mask = (p) => (p.length <= 4 ? '••••' : '•••• ' + p.slice(-4));
const initials = (s) => { const t = String(s).trim(); const m = t.match(/[A-Za-z]/g); return (m ? m.slice(0, 2).join('') : t.slice(0, 1)).toUpperCase(); };
const PALETTE = ['#6366f1', '#0ea5e9', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#14b8a6', '#ec4899'];

function match(t, q) {
    const hay = [t.name, t.fullName, unitName(t.unitId), t.passport, t.email, t.phone, t.notes].join(' ').toLowerCase() + ' ' + digits(t.phone);
    return q.split(/\s+/).filter(Boolean).every((w) => hay.includes(w) || (/^[+\d\-()\s]+$/.test(w) && digits(w).length >= 2 && hay.includes(digits(w))));
}
function render() {
    const q = $('q').value.trim().toLowerCase();
    const list = data.tenants.filter((t) => !q || match(t, q));
    $('sub').textContent = q ? `${list.length} / ${data.tenants.length} tenants` : `${data.tenants.length} tenants`;
    if (!list.length) { $('view').innerHTML = `<div class="text-center text-slate-400 text-sm py-16"><i class="fa-solid fa-user-group text-3xl mb-3 block"></i>${q ? 'No match' : 'No tenants yet'}</div>`; return; }
    $('view').innerHTML = list.map((t) => {
        const color = PALETTE[t.id % PALETTE.length]; const un = unitName(t.unitId); const wa = digits(t.phone);
        const open = shown.has(t.id);
        return `<article class="card p-4">
            <div class="flex items-center gap-3"><div class="w-11 h-11 rounded-2xl text-white font-extrabold flex items-center justify-center text-sm flex-shrink-0" style="background:${color}">${esc(initials(t.name))}</div>
                <div class="min-w-0 flex-1"><div class="font-extrabold text-[15px] truncate">${esc(t.name)}</div><div class="text-[11.5px] text-slate-500 font-semibold truncate">${esc(t.fullName) || '&nbsp;'}</div></div>
                <button onclick="openForm(${t.id})" class="mini bg-slate-100 text-slate-600" aria-label="Edit"><i class="fa-solid fa-pen"></i></button></div>
            ${un ? `<div class="mt-2.5"><span class="chip"><i class="fa-solid fa-building"></i>${esc(un)}</span></div>` : ''}
            <div class="mt-2">
                <div class="row"><i class="ic fa-solid fa-phone"></i><div class="min-w-0 flex-1"><div class="k">Phone</div><div class="v ${t.phone ? '' : 'empty'}">${esc(t.phone) || '—'}</div></div>
                    ${t.phone ? `<a href="tel:${esc(t.phone.replace(/[^\d+]/g, ''))}" class="mini bg-blue-50 text-blue-600" aria-label="Call"><i class="fa-solid fa-phone"></i></a><a href="https://wa.me/${wa}" target="_blank" rel="noopener" class="mini bg-green-50 text-green-600" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>` : ''}</div>
                <div class="row"><i class="ic fa-solid fa-envelope"></i><div class="min-w-0 flex-1"><div class="k">Email</div><div class="v ${t.email ? '' : 'empty'}">${esc(t.email) || '—'}</div></div>
                    ${t.email ? `<a href="mailto:${esc(t.email)}" class="mini bg-amber-50 text-amber-600" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>` : ''}</div>
                <div class="row"><i class="ic fa-solid fa-passport"></i><div class="min-w-0 flex-1"><div class="k">Passport</div><div class="v ${t.passport ? '' : 'empty'}" style="${t.passport ? 'letter-spacing:0.04em' : ''}">${t.passport ? (open ? esc(t.passport) : mask(t.passport)) : '—'}</div></div>
                    ${t.passport ? `<button onclick="toggle(${t.id})" class="mini bg-slate-100 text-slate-600" aria-label="${open ? 'Hide' : 'Show'} passport"><i class="fa-solid ${open ? 'fa-eye-slash' : 'fa-eye'}"></i></button><button onclick="copyText('${esc(t.passport)}')" class="mini bg-slate-100 text-slate-600" aria-label="Copy passport"><i class="fa-regular fa-copy"></i></button>` : ''}</div>
            </div>
            ${t.notes ? `<div class="mt-2 text-[11.5px] text-slate-500 bg-slate-50 rounded-xl p-2.5 leading-relaxed"><i class="fa-regular fa-note-sticky mr-1 text-slate-400"></i>${esc(t.notes)}</div>` : ''}
        </article>`;
    }).join('');
}
function toggle(id) { shown.has(id) ? shown.delete(id) : shown.add(id); render(); }
async function copyText(v) { try { await navigator.clipboard.writeText(v); toast('Copied'); } catch (e) { toast('Could not copy'); } }

function openForm(id) {
    current = id ? data.tenants.find((t) => t.id === id) : null; const t = current || {};
    $('fTitle').textContent = id ? 'Edit tenant' : 'New tenant';
    $('f-unit').innerHTML = '<option value="">— No unit —</option>' + data.units.map((u) => `<option value="${u.id}">${esc(u.name)}</option>`).join('');
    $('f-name').value = t.name || ''; $('f-full').value = t.fullName || ''; $('f-unit').value = t.unitId || ''; $('f-passport').value = t.passport || '';
    $('f-phone').value = t.phone || ''; $('f-email').value = t.email || ''; $('f-notes').value = t.notes || '';
    $('fDelete').classList.toggle('hidden', !id);
    $('sheet').classList.remove('hidden'); $('sheet').scrollTop = 0; document.body.style.overflow = 'hidden';
}
function closeForm() { $('sheet').classList.add('hidden'); document.body.style.overflow = ''; }
async function save() {
    const body = { name: $('f-name').value, fullName: $('f-full').value, unitId: $('f-unit').value || null, passport: $('f-passport').value, phone: $('f-phone').value, email: $('f-email').value, notes: $('f-notes').value };
    try { current ? await api('PUT', 'rental-tenants/' + current.id, body) : await api('POST', 'rental-tenants', body); await load(); closeForm(); toast('Saved'); } catch (e) { toast(e.message); }
}
async function removeTenant() {
    if (!current || !confirm(`Delete ${current.name}? This cannot be undone.`)) return;
    try { await api('DELETE', 'rental-tenants/' + current.id); await load(); closeForm(); toast('Deleted'); } catch (e) { toast(e.message); }
}
async function load() { data = await api('GET', 'rentals'); render(); }
$('view').innerHTML = '<div class="text-center text-slate-400 text-xs py-16"><i class="fa-solid fa-circle-notch fa-spin text-lg mb-2 block"></i>Loading…</div>';
load().catch((e) => { $('view').innerHTML = `<div class="text-center text-red-500 text-sm py-16">${esc(e.message)}</div>`; });
</script>
</body>
</html>
