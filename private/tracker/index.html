<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/x-icon" href="/tracker-icon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/tracker-icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/tracker-icon/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/tracker-icon/apple-touch-icon.png">
    <title>Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
    </script>
    <style>
        :root { --ink: #0f172a; }
        html { background: #0f172a; }
        body {
            font-family: 'Inter', sans-serif; color: #e2e8f0; min-height: 100vh;
            -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
            background:
                radial-gradient(120% 60% at 100% -10%, rgba(34, 197, 94, 0.22) 0%, transparent 55%),
                radial-gradient(90% 55% at -10% 8%, rgba(99, 102, 241, 0.28) 0%, transparent 55%),
                #0f172a;
            background-attachment: fixed;
        }
        .wrap { width: 100%; max-width: 480px; margin: 0 auto; padding: max(1.25rem, env(safe-area-inset-top)) 1.1rem max(2rem, env(safe-area-inset-bottom)); }

        /* entrance */
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        .rise { animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .d1 { animation-delay: 0.05s; } .d2 { animation-delay: 0.12s; } .d3 { animation-delay: 0.2s; } .d4 { animation-delay: 0.28s; }
        @media (prefers-reduced-motion: reduce) { .rise { animation: none; } }

        .glass { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

        /* summary strip */
        .stat { padding: 0.8rem 0.5rem; text-align: center; border-radius: 1rem; }
        .stat b { display: block; font-size: 1.55rem; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
        .stat span { display: block; margin-top: 0.25rem; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #94a3b8; }

        /* feature tiles */
        .tile { position: relative; display: block; border-radius: 1.6rem; padding: 1.15rem; overflow: hidden; color: #fff; text-decoration: none; transition: transform 0.18s ease, box-shadow 0.18s ease; }
        .tile:active { transform: scale(0.975); }
        .tile-sim { background: linear-gradient(135deg, #16a34a 0%, #15803d 55%, #166534 100%); box-shadow: 0 18px 40px -16px rgba(34, 197, 94, 0.55); }
        .tile-bill { background: linear-gradient(135deg, #1e293b 0%, #172033 100%); border: 1px dashed rgba(255, 255, 255, 0.18); }
        .tile::before { content: ''; position: absolute; width: 11rem; height: 11rem; right: -3.5rem; top: -4rem; border-radius: 50%; background: rgba(255, 255, 255, 0.1); }
        .tile::after { content: ''; position: absolute; width: 7rem; height: 7rem; right: 1.5rem; bottom: -4.2rem; border-radius: 50%; background: rgba(255, 255, 255, 0.07); }
        .tile > * { position: relative; z-index: 1; }
        .tile-icon { width: 3rem; height: 3rem; border-radius: 1rem; background: rgba(255, 255, 255, 0.18); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18); }
        .tile-bill .tile-icon { background: rgba(255, 255, 255, 0.07); color: #94a3b8; }
        .tile h2 { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.01em; }
        .tile p { font-size: 0.78rem; font-weight: 500; opacity: 0.82; margin-top: 0.15rem; }
        .chip { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.68rem; font-weight: 800; padding: 0.28rem 0.6rem; border-radius: 999px; background: rgba(255, 255, 255, 0.16); white-space: nowrap; }
        .chip.warn { background: #fef3c7; color: #92400e; }
        .chip.bad { background: #fee2e2; color: #b91c1c; }
        .chip.wa { background: rgba(255, 255, 255, 0.95); color: #15803d; }
        .go { width: 2.2rem; height: 2.2rem; border-radius: 999px; background: #fff; color: #15803d; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; flex-shrink: 0; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18); transition: transform 0.18s ease; }
        .tile:hover .go { transform: translateX(3px); }
        .soon { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #cbd5e1; background: rgba(255, 255, 255, 0.1); padding: 0.28rem 0.6rem; border-radius: 999px; }

        .skeleton { display: inline-block; width: 1.6rem; height: 1.4rem; border-radius: 0.4rem; background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.16), rgba(255,255,255,0.06)); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; vertical-align: middle; }
        @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
        .topbtn { width: 2.4rem; height: 2.4rem; border-radius: 0.85rem; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-size: 0.85rem; text-decoration: none; transition: background 0.15s; }
        .topbtn:active { background: rgba(255, 255, 255, 0.14); }
    </style>
</head>
<body>
    <main class="wrap">

        <!-- top bar -->
        <header class="rise flex items-center justify-between">
            <div class="flex items-center gap-3 min-w-0">
                <img src="/tracker-icon/apple-touch-icon.png" alt="" class="w-11 h-11 rounded-2xl shadow-lg shadow-black/30 flex-shrink-0">
                <div class="min-w-0">
                    <h1 class="text-lg font-extrabold leading-tight tracking-tight">Tracker</h1>
                    <p id="today" class="text-[11px] font-semibold text-slate-400 truncate">&nbsp;</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <a href="/admin/dashboard" class="topbtn glass" title="Back to admin" aria-label="Back to admin"><i class="fa-solid fa-gauge-high"></i></a>
            </div>
        </header>

        <!-- greeting + summary -->
        <section class="rise d1 mt-7">
            <p class="text-[11px] font-bold uppercase tracking-[0.14em] text-emerald-400/90">Overview</p>
            <h2 id="headline" class="mt-1 text-[1.65rem] leading-[1.15] font-extrabold tracking-tight">Everything<br>in one place.</h2>
        </section>

        <section class="rise d2 glass rounded-3xl mt-5 p-2 grid grid-cols-3 gap-1" aria-label="SIM summary">
            <div class="stat"><b id="sTotal"><span class="skeleton"></span></b><span>SIM lines</span></div>
            <div class="stat" style="background: rgba(251, 191, 36, 0.08)"><b id="sSoon" class="text-amber-300"><span class="skeleton"></span></b><span>Expiring ≤ 7d</span></div>
            <div class="stat" style="background: rgba(248, 113, 113, 0.08)"><b id="sOver" class="text-red-300"><span class="skeleton"></span></b><span>Expired</span></div>
        </section>

        <!-- features -->
        <p class="rise d3 mt-8 mb-3 text-[11px] font-bold uppercase tracking-[0.14em] text-slate-400">Your tools</p>
        <div class="space-y-3.5">
            <a href="/tracker/sim/" class="tile tile-sim rise d3">
                <div class="flex items-start justify-between gap-3">
                    <div class="tile-icon"><i class="fa-solid fa-sim-card"></i></div>
                    <span class="go"><i class="fa-solid fa-arrow-right"></i></span>
                </div>
                <h2 class="mt-4">SIM Tracker</h2>
                <p>Phone lines, top-ups and the 60-day countdown.</p>
                <div id="simChips" class="mt-4 flex flex-wrap gap-1.5"><span class="chip"><i class="fa-solid fa-circle-notch fa-spin"></i>Loading…</span></div>
            </a>

            <div class="tile tile-bill rise d4" aria-disabled="true">
                <div class="flex items-start justify-between gap-3">
                    <div class="tile-icon"><i class="fa-solid fa-file-invoice-dollar"></i></div>
                    <span class="soon">Coming soon</span>
                </div>
                <h2 class="mt-4 text-slate-200">Bill</h2>
                <p class="text-slate-400" style="opacity: 1">Bills and due dates, tracked here.</p>
            </div>
        </div>

        <p class="rise d4 mt-8 text-center text-[11px] font-semibold text-slate-500">m.boutiquehomes · private</p>
    </main>

    <script>
        // today, in this phone's own time zone
        function dayStart(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
        const now = new Date();
        document.getElementById('today').textContent = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

        // same rule as the SIM page: days left until the expiry date (negative = already past)
        const daysLeft = (expDate) => Math.ceil((dayStart(expDate) - dayStart(new Date())) / 86400000);
        const $ = (id) => document.getElementById(id);

        async function load() {
            let sims;
            try {
                const res = await fetch('/api/admin/sims', { credentials: 'same-origin' });
                if (res.status === 401) { window.location.replace('/admin/?next=%2Ftracker%2F'); return; }
                if (!res.ok) throw new Error('bad status');
                sims = (await res.json()).sims;
            } catch (e) {
                ['sTotal', 'sSoon', 'sOver'].forEach((id) => { $(id).textContent = '–'; });
                $('simChips').innerHTML = '<span class="chip bad"><i class="fa-solid fa-triangle-exclamation"></i>Could not load</span>';
                return;
            }
            const days = sims.map((s) => daysLeft(s.expDate));
            const over = days.filter((d) => d < 0).length;
            const soon = days.filter((d) => d >= 0 && d <= 7).length;
            const wa = sims.filter((s) => s.whatsapp === 'active').length;
            $('sTotal').textContent = sims.length;
            $('sSoon').textContent = soon;
            $('sOver').textContent = over;

            const chips = [`<span class="chip"><i class="fa-solid fa-mobile-screen"></i>${sims.length} ${sims.length === 1 ? 'line' : 'lines'}</span>`];
            if (wa) chips.push(`<span class="chip wa"><i class="fa-brands fa-whatsapp"></i>${wa} WhatsApp</span>`);
            if (soon) chips.push(`<span class="chip warn"><i class="fa-solid fa-clock"></i>${soon} expiring soon</span>`);
            if (over) chips.push(`<span class="chip bad"><i class="fa-solid fa-circle-xmark"></i>${over} expired</span>`);
            if (!soon && !over && sims.length) chips.push('<span class="chip"><i class="fa-solid fa-circle-check"></i>All good</span>');
            $('simChips').innerHTML = chips.join('');

            $('headline').innerHTML = over || soon
                ? `${over + soon} ${over + soon === 1 ? 'line needs' : 'lines need'}<br>your attention.`
                : 'All lines are<br>in good shape.';
        }
        load();
    </script>
</body>
</html>
