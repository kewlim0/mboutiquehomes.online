<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MIMIC-IV progress</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:14px;background:#fff;color:#111}
@media(prefers-color-scheme:dark){body{background:#1a1a19;color:#f0efec}.bar,.card{background:#2c2c2a!important}}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.card{background:#f3f2ee;border-radius:8px;padding:10px}.card small{display:block;font-size:12px;opacity:.7}.card b{font-size:20px;font-weight:500}
.row{margin:7px 0;font-size:13px}.top{display:flex;justify-content:space-between;gap:8px}
.bar{height:8px;background:#e1e0d9;border-radius:4px;overflow:hidden;margin-top:3px}.fill{height:100%}
</style></head><body>
<h3 style="font-weight:500;margin:0">MIMIC-IV download (live)</h3>
<div id="t" style="font-size:12px;opacity:.7"></div>
<div class="cards" id="c"></div><div id="r"></div>
<script>
const f=n=>n>=1e9?(n/1e9).toFixed(2)+" GB":n>=1e6?(n/1e6).toFixed(1)+" MB":(n/1e3).toFixed(0)+" KB";
let last=null,lastT=0;
async function tick(){try{
const d=await (await fetch("/temporary/live-update/api",{cache:"no-store"})).json();
const H=d.files.reduce((a,x)=>a+x[1],0),E=d.files.reduce((a,x)=>a+x[2],0);
const done=d.files.filter(x=>x[1]>=x[2]).length,run=d.files.filter(x=>x[1]>0&&x[1]<x[2]).length;
let sp="-";const now=Date.now();
if(last!==null&&now>lastT){sp=((H-last)/((now-lastT)/1000)/1e6*60).toFixed(1)+" MB/min"}
last=H;lastT=now;
document.getElementById("t").textContent=d.files.length?"Updated "+new Date().toLocaleTimeString()+" - refresh every 5 s":"Waiting for the first update... (refresh every 5 s)";
document.getElementById("c").innerHTML=[["Downloaded",f(H)],["Total",f(E)],["Overall",(E?100*H/E:0).toFixed(2)+"%"],["Speed",sp],["Done",done+" / "+d.files.length],["In progress",run]].map(c=>'<div class="card"><small>'+c[0]+'</small><b>'+c[1]+'</b></div>').join("");
document.getElementById("r").innerHTML=d.files.map(([n,h,e])=>{const p=e?100*h/e:0,ok=e>0&&h>=e;return '<div class="row"><div class="top"><span>'+n+'</span><span>'+(ok?"done - "+f(e):f(h)+" / "+f(e))+'</span></div><div class="bar"><div class="fill" style="width:'+Math.max(p,h>0?1:0).toFixed(1)+'%;background:'+(ok?"#1baf7a":"#2a78d6")+'"></div></div></div>'}).join("");
}catch(e){document.getElementById("t").textContent="Connection lost, retrying..."}}
tick();setInterval(tick,5000);
</script></body></html>
