<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#171A1F">
<title>没有网络</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; text-align: center; font-family: -apple-system, 'Inter', 'PingFang SC', 'Noto Sans SC', sans-serif; color: #e2e8f0; background: radial-gradient(120% 60% at 100% -10%, rgba(197, 160, 89, 0.22), transparent 55%), #171A1F; }
  img { width: 4.5rem; height: 4.5rem; border-radius: 1.2rem; box-shadow: 0 14px 30px -12px rgba(0, 0, 0, 0.6); }
  h1 { margin-top: 1.2rem; font-size: 1.25rem; font-weight: 800; }
  p { margin-top: 0.5rem; font-size: 0.85rem; line-height: 1.6; color: #94a3b8; }
  button { margin-top: 1.4rem; padding: 0.8rem 1.6rem; border: 0; border-radius: 0.9rem; font: inherit; font-weight: 800; color: #fff; background: linear-gradient(135deg, #D4B26A, #B38A3E); box-shadow: 0 10px 22px -10px rgba(179, 138, 62, 0.9); }
</style>
</head>
<body>
  <main>
    <img src="/admin/icon-192.png" alt="">
    <h1>没有网络</h1>
    <p>后台需要联网才能看到和修改最新的资料。<br>请连上 Wi-Fi 或手机流量，然后再试一次。</p>
    <button onclick="location.href='/admin/dashboard'">重试</button>
  </main>
</body>
</html>
