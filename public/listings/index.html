<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <title>房源 | m.boutiquehomes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            50: '#FAF7EE',
                            100: '#F3EDD7',
                            300: '#DECB93',
                            500: '#C5A059',
                            600: '#B08B43',
                            700: '#8A6A2E',
                        },
                        charcoal: {
                            800: '#23272F',
                            900: '#171A1F',
                        },
                        cream: '#FAF8F5',
                        softbg: '#F3F4F8'
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                        sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../gallery.css">
</head>
<body class="antialiased selection:bg-gold-500 selection:text-white" data-page="listings">

    <!-- Main Outer Container Frame -->
    <div class="mobile-frame">

        <!-- FIXED HEADER -->
        <header class="sticky top-0 z-30 bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between shadow-sm">
            <a href="/" class="flex items-center space-x-2" aria-label="Home">
                <img src="../img/logo-192.png" alt="m.boutiquehomes" class="w-8 h-8 rounded-full shadow-md flex-shrink-0">
                <div>
                    <h1 class="font-serif font-bold text-sm tracking-wide text-charcoal-900 leading-none">m.boutiquehomes</h1>
                    <span class="block mt-1 leading-none text-[9px] uppercase tracking-widest text-gold-600 font-semibold"><span data-i18n="brandSub">吉隆坡尊荣房产</span></span>
                </div>
            </a>

            <!-- Controls: Unit Toggle & WhatsApp -->
            <div class="flex items-center space-x-2">
                <button id="langToggleBtn" onclick="toggleLanguage()" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-gray-100 hover:bg-gold-50 text-gray-700 hover:text-gold-700 border border-gray-200 transition-all flex items-center space-x-1" aria-label="Switch language">
                    <i class="fa-solid fa-globe text-[10px] text-gold-600"></i>
                    <span><span id="langZh" class="lang-opt">中</span> / <span id="langEn" class="lang-opt">EN</span></span>
                </button>
                <a href="https://api.whatsapp.com/send?phone=60149314514" target="_blank" rel="noopener noreferrer" class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-md hover:bg-emerald-600 transition">
                    <i class="fa-brands fa-whatsapp text-base"></i>
                </a>
            </div>
        </header>

        <!-- SCROLLABLE MAIN CONTENT AREA -->
        <main class="flex-1 pb-24">

                        <!-- LISTINGS SECTION & FILTER BAR -->
            <section id="listingsSection" class="mt-5 px-4">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <h2 class="font-serif text-lg font-bold text-charcoal-900"><span data-i18n="listingsTitle">臻选奢华房源</span></h2>
                        <p class="text-[11px] text-gray-500"><span data-i18n="listingsSub">KLCC & 吉隆坡核心地段独立筛选</span></p>
                    </div>
                    <span id="resultCount" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-gold-50 text-gold-700 border border-gold-200"></span>
                </div>

                <!-- Interactive Filters -->
                <div class="space-y-2 mb-4">
                    <!-- Type Filter Tabs -->
                    <div class="flex bg-gray-200/70 p-1 rounded-xl text-xs font-medium">
                        <button onclick="setFilterType('all')" id="filterAll" class="flex-1 py-1.5 rounded-lg text-center bg-white text-charcoal-900 font-bold shadow-sm transition"><span data-i18n="filterAll">全部</span></button>
                        <button onclick="setFilterType('sale')" id="filterSale" class="flex-1 py-1.5 rounded-lg text-center text-gray-600 hover:text-charcoal-900 transition"><span data-i18n="filterSale">出售 (Sale)</span></button>
                        <button onclick="setFilterType('rent')" id="filterRent" class="flex-1 py-1.5 rounded-lg text-center text-gray-600 hover:text-charcoal-900 transition"><span data-i18n="filterRent">出租 (Rent)</span></button>
                    </div>

                    <!-- Area Pill Filters -->
                    <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1">
                        <button onclick="setAreaFilter('all')" data-area="all" class="area-btn active px-3 py-1 rounded-full text-xs whitespace-nowrap bg-charcoal-900 text-white font-medium shadow-sm"><span data-i18n="areaAll">全地段</span></button>
                        <button onclick="setAreaFilter('KLCC')" data-area="KLCC" class="area-btn px-3 py-1 rounded-full text-xs whitespace-nowrap bg-white text-gray-600 border border-gray-200 font-medium"><span data-i18n="areaKLCC">KLCC 核心区</span></button>
                        <button onclick="setAreaFilter('Mont Kiara')" data-area="Mont Kiara" class="area-btn px-3 py-1 rounded-full text-xs whitespace-nowrap bg-white text-gray-600 border border-gray-200 font-medium"><span data-i18n="areaMK">满家乐 Mont Kiara</span></button>
                        <button onclick="setAreaFilter('TRX')" data-area="TRX" class="area-btn px-3 py-1 rounded-full text-xs whitespace-nowrap bg-white text-gray-600 border border-gray-200 font-medium"><span data-i18n="areaTRX">TRX 金融中心</span></button>
                        <button onclick="setAreaFilter('Bangsar')" data-area="Bangsar" class="area-btn px-3 py-1 rounded-full text-xs whitespace-nowrap bg-white text-gray-600 border border-gray-200 font-medium"><span data-i18n="areaBangsar">Bangsar 邸宅</span></button>
                        <button onclick="setAreaFilter('Outskirt')" data-area="Outskirt" class="area-btn px-3 py-1 rounded-full text-xs whitespace-nowrap bg-white text-gray-600 border border-gray-200 font-medium"><span data-i18n="areaOutskirt">郊区</span></button>
                        <button onclick="setAreaFilter('Bukit Tunku')" data-area="Bukit Tunku" class="area-btn px-3 py-1 rounded-full text-xs whitespace-nowrap bg-white text-gray-600 border border-gray-200 font-medium"><span data-i18n="areaBukitTunku">Bukit Tunku</span></button>
                        <button onclick="setAreaFilter('Damansara Heights')" data-area="Damansara Heights" class="area-btn px-3 py-1 rounded-full text-xs whitespace-nowrap bg-white text-gray-600 border border-gray-200 font-medium"><span data-i18n="areaDH">Damansara Heights</span></button>
                        <button onclick="setAreaFilter('Seputeh')" data-area="Seputeh" class="area-btn px-3 py-1 rounded-full text-xs whitespace-nowrap bg-white text-gray-600 border border-gray-200 font-medium"><span data-i18n="areaSeputeh">Seputeh</span></button>
                    </div>
                </div>

                <!-- PROPERTY LISTINGS CONTAINER -->
                <div id="propertyGrid" class="grid grid-cols-2 gap-3 items-stretch">
                    <!-- Property cards are rendered dynamically by script.js -->
                </div>
            </section>

        </main>

        <!-- FIXED BOTTOM NAVIGATION BAR -->
        <nav class="bottom-nav is-loading fixed bottom-0 left-0 right-0 mx-auto w-full bg-white border-t border-gray-200/80 px-6 py-2 z-30 flex justify-between items-center text-gray-400">
            <!-- Skeleton shown while the page is loading -->
            <div class="nav-skeleton absolute inset-0 px-6 justify-between items-center" aria-hidden="true">
                <div class="flex flex-col items-center gap-1.5"><div class="skeleton w-5 h-5 rounded-md"></div><div class="skeleton h-2 w-7 rounded"></div></div>
                <div class="flex flex-col items-center gap-1.5"><div class="skeleton w-5 h-5 rounded-md"></div><div class="skeleton h-2 w-7 rounded"></div></div>
                <div class="flex flex-col items-center gap-1.5"><div class="skeleton w-9 h-9 rounded-full -mt-5 border-2 border-white"></div><div class="skeleton h-2 w-9 rounded"></div></div>
                <div class="flex flex-col items-center gap-1.5"><div class="skeleton w-5 h-5 rounded-md"></div><div class="skeleton h-2 w-9 rounded"></div></div>
                <div class="flex flex-col items-center gap-1.5"><div class="skeleton w-5 h-5 rounded-md"></div><div class="skeleton h-2 w-7 rounded"></div></div>
            </div>

            <a href="/" class="flex flex-col items-center space-y-1 hover:text-gold-600 transition">
                <i class="fa-solid fa-house text-base"></i>
                <span class="text-[10px]"><span data-i18n="navHome">首页</span></span>
            </a>
            <a href="/listings/" aria-current="page" class="flex flex-col items-center space-y-1 text-gold-600 font-semibold">
                <i class="fa-solid fa-building text-base"></i>
                <span class="text-[10px]"><span data-i18n="navListings">房源</span></span>
            </a>
            <button onclick="openValuationModal()" class="flex flex-col items-center space-y-1 hover:text-gold-600 transition">
                <div class="w-9 h-9 rounded-full gold-gradient-bg text-white flex items-center justify-center -mt-5 shadow-lg border-2 border-white">
                    <i class="fa-solid fa-calculator text-sm"></i>
                </div>
                <span class="text-[10px] text-gold-700 font-medium"><span data-i18n="navValuation">估值放盘</span></span>
            </button>
            <button onclick="scrollToTeam()" class="flex flex-col items-center space-y-1 hover:text-gold-600 transition">
                <i class="fa-solid fa-user-shield text-base"></i>
                <span class="text-[10px]"><span data-i18n="navTeam">管家团队</span></span>
            </button>
            <a href="https://api.whatsapp.com/send?phone=60149314514" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center space-y-1 hover:text-emerald-600 transition">
                <i class="fa-solid fa-headset text-base"></i>
                <span class="text-[10px]"><span data-i18n="navContact">咨询</span></span>
            </a>
        </nav>

        <!-- MODAL 1: OWNER / SELLER PROPERTY VALUATION & SHOOTING FORM -->
        <div id="valuationModal" class="hidden absolute inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center transition-all duration-300">
            <div class="bg-white w-full max-h-[90%] rounded-t-3xl sm:rounded-2xl overflow-y-auto p-5 text-charcoal-900 shadow-2xl relative animate-slide-up">
                <!-- Close Button -->
                <button onclick="closeValuationModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center hover:bg-gray-200">
                    <i class="fa-solid fa-xmark"></i>
                </button>

                <div class="flex items-center space-x-2 text-gold-600 mb-1">
                    <i class="fa-solid fa-camera-retro text-lg"></i>
                    <span class="text-xs font-bold uppercase tracking-wider">Owner Service</span>
                </div>
                <h3 class="font-serif text-xl font-bold text-charcoal-900"><span data-i18n="modalOwnerTitle">业主委托 · 拍摄与估值</span></h3>
                <p class="text-xs text-gray-500 mb-4"><span data-i18n="modalOwnerSub">填写您的项目信息，顾问将在 2 小时内为您提供市场评估报告。</span></p>

                <form id="ownerForm" onsubmit="submitValuationForm(event)" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-700 mb-1"><span data-i18n="intentLabel">意向服务场景</span></label>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <label class="flex items-center space-x-2 border p-2.5 rounded-xl cursor-pointer hover:bg-gold-50">
                                <input type="radio" name="intent" value="rent" checked class="accent-gold-600">
                                <span class="font-medium"><span data-i18n="intentRent">出租房源 (For Rent)</span></span>
                            </label>
                            <label class="flex items-center space-x-2 border p-2.5 rounded-xl cursor-pointer hover:bg-gold-50">
                                <input type="radio" name="intent" value="sale" class="accent-gold-600">
                                <span class="font-medium"><span data-i18n="intentSale">出售房源 (For Sale)</span></span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-gray-700 mb-1"><span data-i18n="projectLabel">项目名称 / 大楼名</span></label>
                        <input type="text" required placeholder="例如: Pavilion Suites / The Residences" data-i18n-placeholder="phProject" class="w-full text-xs p-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-gold-500">
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label for="areaRange" class="block text-[11px] font-bold text-gray-700 mb-1"><span data-i18n="areaLabel">建筑面积 (sqft)</span></label>
                            <select id="areaRange" required class="w-full text-xs p-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-gold-500 bg-white">
                                <option value="" disabled selected data-i18n="selectPlaceholder">请选择</option>
                                <option value="<500 sqft" data-i18n="a1">500 sqft 以下</option>
                                <option value="500-800" data-i18n="a2">500 – 800 sqft</option>
                                <option value="800-1200" data-i18n="a3">800 – 1,200 sqft</option>
                                <option value="1200-2000" data-i18n="a4">1,200 – 2,000 sqft</option>
                                <option value="2000-3500" data-i18n="a5">2,000 – 3,500 sqft</option>
                                <option value="3500+" data-i18n="a6">3,500 sqft 以上</option>
                            </select>
                        </div>
                        <div>
                            <label for="bedrooms" class="block text-[11px] font-bold text-gray-700 mb-1"><span data-i18n="bedroomsLabel">房间数</span></label>
                            <select id="bedrooms" required class="w-full text-xs p-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-gold-500 bg-white">
                                <option value="" disabled selected data-i18n="selectPlaceholder">请选择</option>
                                <option value="studio" data-i18n="bed0">开放式 Studio</option>
                                <option value="1" data-i18n="bed1">1 房</option>
                                <option value="2" data-i18n="bed2">2 房</option>
                                <option value="3" data-i18n="bed3">3 房</option>
                                <option value="4" data-i18n="bed4">4 房</option>
                                <option value="5+" data-i18n="bed5">5 房或以上</option>
                            </select>
                        </div>
                        <div>
                            <label for="bathrooms" class="block text-[11px] font-bold text-gray-700 mb-1"><span data-i18n="bathroomsLabel">卫生间数</span></label>
                            <select id="bathrooms" required class="w-full text-xs p-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-gold-500 bg-white">
                                <option value="" disabled selected data-i18n="selectPlaceholder">请选择</option>
                                <option value="1" data-i18n="bath1">1 卫</option>
                                <option value="2" data-i18n="bath2">2 卫</option>
                                <option value="3" data-i18n="bath3">3 卫</option>
                                <option value="4" data-i18n="bath4">4 卫</option>
                                <option value="5+" data-i18n="bath5">5 卫或以上</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-gray-700 mb-1"><span data-i18n="contactLabel">联系人姓名与电话/微信</span></label>
                        <input type="text" required placeholder="张先生 / +60 12-345 6789" data-i18n-placeholder="phContact" class="w-full text-xs p-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-gold-500">
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="w-full py-3 rounded-xl gold-gradient-bg text-white font-bold text-xs shadow-lg hover:brightness-105 active:scale-[0.99] transition">
                            <i class="fa-solid fa-paper-plane mr-1.5"></i> <span data-i18n="submitBtn">提交并预约免费 HD 摄影与评估</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- MODAL 2: PROPERTY DETAIL VIEW -->
        <div id="detailModal" class="hidden absolute inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center transition-all">
            <div class="bg-white w-full max-h-[92%] rounded-t-3xl sm:rounded-2xl overflow-y-auto text-charcoal-900 shadow-2xl relative animate-slide-up">
                <!-- Close Button -->
                <button onclick="closeDetailModal()" aria-label="关闭" class="absolute top-3 right-3 z-20 w-8 h-8 rounded-full bg-black/50 text-white flex items-center justify-center hover:bg-black/70 backdrop-blur-md">
                    <i class="fa-solid fa-xmark"></i>
                </button>

                <!-- Modal Image Carousel Header -->
                <div class="relative h-60 w-full skeleton">
                    <div id="modalGallery" class="w-full h-full"></div>
                    <div id="modalImgCaption" class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-full text-white text-[10px] font-medium">
                        <i class="fa-solid fa-camera mr-1"></i> <span data-i18n="realPhoto">实拍样板间照片</span>
                    </div>
                    <span id="modalClosedBadge" class="hidden absolute right-3 bottom-3 px-3 py-1.5 rounded-full bg-white/95 text-charcoal-900 text-[11px] font-extrabold uppercase tracking-wider shadow-md"></span>
                    <span id="modalTypeBadge" class="absolute top-3 left-3 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-gold-500 text-white shadow-md">
                        <span data-i18n="detailTagDefault">出租</span>
                    </span>
                </div>

                <!-- Content -->
                <!-- Skeleton shown while the detail view is loading -->
                <div id="modalSkeleton" class="p-5 space-y-4" aria-hidden="true">
                    <div class="flex justify-between items-start gap-2">
                        <div class="flex-1 space-y-2">
                            <div class="skeleton h-5 w-10/12 rounded"></div>
                            <div class="skeleton h-3 w-6/12 rounded"></div>
                        </div>
                        <div class="skeleton h-5 w-20 rounded"></div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 p-3 rounded-xl border border-gray-100">
                        <div class="skeleton h-9 rounded"></div>
                        <div class="skeleton h-9 rounded"></div>
                        <div class="skeleton h-9 rounded"></div>
                    </div>
                    <div>
                        <div class="skeleton h-3 w-24 rounded mb-2.5"></div>
                        <div class="flex flex-wrap gap-1.5">
                            <div class="skeleton h-6 w-24 rounded-md"></div>
                            <div class="skeleton h-6 w-24 rounded-md"></div>
                            <div class="skeleton h-6 w-20 rounded-md"></div>
                            <div class="skeleton h-6 w-28 rounded-md"></div>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="skeleton h-3 w-16 rounded"></div>
                        <div class="skeleton h-3 w-full rounded"></div>
                        <div class="skeleton h-3 w-full rounded"></div>
                        <div class="skeleton h-3 w-8/12 rounded"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-2 border-t border-gray-100">
                        <div class="skeleton h-11 rounded-xl"></div>
                        <div class="skeleton h-11 rounded-xl"></div>
                    </div>
                </div>

                <!-- Content -->
                <div id="modalContent" class="p-5 space-y-4">
                    <div>
                        <div class="flex justify-between items-start gap-2">
                            <h2 id="modalTitle" class="font-serif text-lg font-bold text-charcoal-900">Pavilion Suites KLCC</h2>
                            <span id="modalPrice" class="text-base font-bold text-gold-700 flex-shrink-0 whitespace-nowrap">RM 6,500 / 月</span>
                        </div>
                        <!-- address takes most of the row; a small column on the right holds the copy-link button -->
                        <div class="mt-1 grid grid-cols-[minmax(0,1fr)_auto] items-start gap-2">
                            <p id="modalLocation" class="text-xs text-gray-500 min-w-0"><i class="fa-solid fa-location-dot text-gold-600 mr-1"></i> Jalan Bukit Bintang, KLCC</p>
                            <button type="button" id="shareBtn" class="flex flex-row items-center gap-1.5 px-3 py-1.5 rounded-full border border-gold-500/40 text-gold-700 hover:bg-gold-500/10 active:scale-95 transition">
                                <i class="fa-regular fa-copy text-sm" aria-hidden="true"></i>
                                <span id="shareBtnLabel" class="text-[11px] font-bold leading-none whitespace-nowrap">复制连接</span>
                            </button>
                        </div>
                    </div>

                    <!-- Key Spec Grid -->
                    <div class="grid grid-cols-3 gap-2 bg-cream p-3 rounded-xl border border-gold-200/50 text-center">
                        <div>
                            <span class="block text-[10px] text-gray-400 uppercase"><span data-i18n="specArea">实用面积</span></span>
                            <strong id="modalArea" class="text-xs font-bold text-charcoal-900">1,250 sqft</strong>
                        </div>
                        <div class="border-x border-gray-200">
                            <span class="block text-[10px] text-gray-400 uppercase"><span data-i18n="specBeds">卧室/卫浴</span></span>
                            <strong id="modalBeds" class="text-xs font-bold text-charcoal-900">2 房 2 卫</strong>
                        </div>
                        <div>
                            <span class="block text-[10px] text-gray-400 uppercase"><span data-i18n="specFurnish">装修状态</span></span>
                            <strong id="modalFurnish" class="text-xs font-bold text-gold-700"><span data-i18n="furnishDefault">精装全配 95%新</span></strong>
                        </div>
                    </div>

                    <!-- Highlights (filled per listing from the admin) -->
                    <div id="modalHighlightsWrap">
                        <h4 class="text-xs font-bold text-charcoal-900 mb-2"><span data-i18n="highlightsTitle">房源亮点与配置</span></h4>
                        <div id="modalHighlights" class="flex flex-wrap gap-1.5 text-[10px]"></div>
                    </div>

                    <!-- Description -->
                    <div>
                        <h4 class="text-xs font-bold text-charcoal-900 mb-1"><span data-i18n="descTitle">详细描述</span></h4>
                        <p id="modalDesc" class="text-xs text-gray-600 leading-relaxed">
                            
                        </p>
                    </div>

                    <!-- CTA Buttons -->
                    <div class="grid grid-cols-2 gap-2 pt-2 border-t border-gray-100">
                        <a id="modalBookBtn" href="https://api.whatsapp.com/send?phone=60149314514" target="_blank" rel="noopener noreferrer" class="py-3 px-2 rounded-xl bg-emerald-500 text-white font-bold text-xs flex items-center justify-center gap-1.5 text-center shadow-md hover:bg-emerald-600">
                            <i class="fa-brands fa-whatsapp text-base flex-shrink-0"></i><span data-i18n="waBook" class="whitespace-nowrap">WhatsApp 预约看房</span>
                        </a>
                        <button onclick="openValuationModal(); closeDetailModal();" class="py-3 px-2 rounded-xl bg-charcoal-900 text-white font-bold text-xs flex items-center justify-center gap-1.5 text-center hover:bg-charcoal-800">
                            <i class="fa-solid fa-calculator text-gold-400 flex-shrink-0"></i><span data-i18n="listSimilar" class="whitespace-nowrap">我有同款房放盘</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

            <button type="button" id="lbNext" class="lb-nav lb-next" aria-label="下一张"><i class="fa-solid fa-chevron-right"></i></button>
